name: Percept X Search
on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Public X search query'
        required: true
        default: 'Afghanistan'
        type: string
      limit:
        description: 'Maximum posts (1-100)'
        required: true
        default: '20'
        type: string
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install twscrape
        run: python -m pip install --disable-pip-version-check twscrape
      - name: Check CLI
        run: twscrape --help
      - name: Search X
        env:
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          X_EMAIL_PASSWORD: ${{ secrets.X_EMAIL_PASSWORD }}
          SEARCH_QUERY: ${{ inputs.query }}
          SEARCH_LIMIT: ${{ inputs.limit }}
        run: python scripts/x_search.py --query "$SEARCH_QUERY" --limit "$SEARCH_LIMIT"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-search-results
          path: results/
          if-no-files-found: ignore
          retention-days: 7
